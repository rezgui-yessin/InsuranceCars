<div class="container-fluid p-0">
  <div class="row g-0">
    <div class="col-lg-2 col-md-3">
      <app-sidebar [items]="sidebarItems" title="My Account"></app-sidebar>
    </div>
    <div class="col-lg-10 col-md-9 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Cars</h2>
        <button class="btn btn-primary" (click)="toggleAddCarForm()">
          <i class="bi" [ngClass]="showAddCarForm ? 'bi-x-lg' : 'bi-plus-lg'"></i>
          {{ showAddCarForm ? 'Cancel' : 'Add New Car' }}
        </button>
      </div>

      <!-- Add Car Form -->
      <div class="card shadow-sm mb-4" *ngIf="showAddCarForm">
        <div class="card-header bg-white">
          <h5 class="mb-0">Add New Vehicle</h5>
        </div>
        <div class="card-body">
          <form [formGroup]="carForm" (ngSubmit)="onSubmit()">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Brand/Make</label>
                <input type="text" class="form-control" formControlName="brand" placeholder="e.g. Toyota">
              </div>
              <div class="col-md-6">
                <label class="form-label">Model</label>
                <input type="text" class="form-control" formControlName="model" placeholder="e.g. Camry">
              </div>
              <div class="col-md-4">
                <label class="form-label">Year</label>
                <input type="number" class="form-control" formControlName="year" placeholder="YYYY">
              </div>
              <div class="col-md-4">
                <label class="form-label">License Plate</label>
                <input type="text" class="form-control" formControlName="plateNumber">
              </div>
              <div class="col-md-4">
                <label class="form-label">VIN</label>
                <input type="text" class="form-control" formControlName="vin">
              </div>
              <div class="col-12">
                <label class="form-label">Car Image</label>
                <input type="file" class="form-control" (change)="onFileSelected($event)" accept="image/*">
              </div>
              <div class="col-12 text-end">
                <button type="submit" class="btn btn-success px-4" [disabled]="carForm.invalid">
                  Add Car
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Cars List -->
      <div class="row g-4" *ngIf="cars$ | async as cars">
        <div class="col-md-6 col-lg-4" *ngFor="let car of cars">
          <div class="card h-100 shadow-sm border-0 car-card">
            <div class="card-img-top-wrapper">
              <img [src]="car.imageUrl || 'assets/images/default-car.png'" class="card-img-top" alt="{{car.brand}} {{car.model}}">
            </div>
            <div class="card-body">
              <h5 class="card-title fw-bold">{{car.year}} {{car.brand}} {{car.model}}</h5>
              <p class="text-muted mb-2">Plate: {{car.plateNumber}}</p>
              <p class="text-muted small">VIN: {{car.vin}}</p>
            </div>
            <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center">
              <button class="btn btn-sm btn-outline-danger" (click)="deleteCar(car.id)">
                <i class="bi bi-trash"></i> Remove
              </button>
              <span class="badge bg-secondary">Verified</span>
            </div>
          </div>
        </div>
        
        <div class="col-12" *ngIf="cars.length === 0 && !showAddCarForm">
          <div class="alert alert-info text-center">
            You haven't added any cars yet. Click "Add New Car" to get started.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
