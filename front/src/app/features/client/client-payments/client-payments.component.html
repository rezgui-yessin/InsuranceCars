<div class="container-fluid p-0">
  <div class="row g-0">
    <div class="col-lg-2 col-md-3">
      <app-sidebar [items]="sidebarItems" title="My Account"></app-sidebar>
    </div>
    <div class="col-lg-10 col-md-9 p-4">
      <h2 class="mb-4">Make a Payment</h2>
      
      <div class="row">
          <div class="col-md-8 col-lg-6">
              <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 px-4">
                    <h5 class="fw-bold">Secure Payment via Stripe</h5>
                </div>
                <div class="card-body px-4 pb-4">
                  <form [formGroup]="paymentForm" (ngSubmit)="pay()">
                    
                    <div class="mb-3">
                      <label class="form-label">Policy ID (For Simulation)</label>
                      <input class="form-control" formControlName="policyId" placeholder="Enter Policy ID to pay for">
                      <small class="text-muted">In a real flow, this would be pre-selected.</small>
                    </div>
                    
                    <div class="mb-3">
                       <label class="form-label">Amount (USD)</label>
                       <div class="input-group">
                           <span class="input-group-text">$</span>
                           <input type="number" class="form-control" formControlName="amount" min="1">
                       </div>
                    </div>
                    
                    <div class="mb-4">
                       <label class="form-label">Cardholder Name</label>
                       <input type="text" class="form-control" formControlName="name" placeholder="Name on card">
                    </div>
          
                    <div class="mb-4">
                       <label class="form-label mb-2">Card Details</label>
                       <div class="stripe-card-container p-3 border rounded">
                           <ngx-stripe-card [options]="cardOptions" [elementsOptions]="elementsOptions"></ngx-stripe-card>
                       </div>
                    </div>
          
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-medium" [disabled]="paymentForm.invalid || isProcessing">
                      <span *ngIf="isProcessing" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                      {{ isProcessing ? 'Processing Payment...' : 'Pay Now' }}
                    </button>
                  </form>
                </div>
              </div>
          </div>
          
          <div class="col-md-4">
              <div class="alert alert-info border-0 shadow-sm">
                  <h6 class="alert-heading fw-bold"><i class="bi bi-info-circle me-2"></i>Test Mode</h6>
                  <p class="mb-0 small">This payment system is in test mode. You can use Stripe test cards (e.g., 4242 4242 4242 4242) to simulate a successful payment.</p>
              </div>
          </div>
      </div>
    </div>
  </div>
</div>
